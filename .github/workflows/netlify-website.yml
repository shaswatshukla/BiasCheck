name: Verify Netlify website
on:
  push:
    paths: ['website/**', 'netlify.toml', '.github/workflows/netlify-website.yml']
  pull_request:
    paths: ['website/**', 'netlify.toml', '.github/workflows/netlify-website.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
